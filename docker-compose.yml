# Docker Compose is the local/staging deployment contract for agent-fitness-functions.
# Compose applies restart, mounts, read_only, tmpfs, cap_drop, and security_opt locally.
# Resource enforcement differs by runtime: local Compose treats deploy.resources as
# advisory compatibility metadata, while Swarm has enforced deploy.resources limits.
# Kubernetes production deployments MUST use the Helm chart as authoritative.
# The production Helm chart is maintained externally and is NOT included in this repository.
# Helm chart is authoritative for pod securityContext, resources.limits,
# ConfigMaps, Secrets, and read-only mounts.
services:
  agent-fitness-functions:
    image: agent-fitness-functions:${GIT_SHA:-local}
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    ports:
      - "7890:7890"
    # The managed selector pins one immutable certificate generation at startup.
    command:
      - --addr
      - 0.0.0.0:7890
    volumes:
      - ./configs:/app/configs
      - ./certs:/app/certs:ro
      - ./caller-repos.json:/app/caller-repos.json
    environment:
      AGENT_FITNESS_FUNCTIONS_CONFIGS_DIR: /app/configs
      AGENT_FITNESS_FUNCTIONS_DEV_CERT_DIR: /app/certs
      AGENT_FITNESS_FUNCTIONS_RUNTIME_DIR: /run/agent-fitness-functions
      AGENT_FITNESS_FUNCTIONS_RATE_LIMIT: "100"
      AGENT_FITNESS_FUNCTIONS_ANALYZER_TIMEOUT: "30s"
      AGENT_FITNESS_FUNCTIONS_DISABLE_REGISTRATION: "0"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --cacert /run/agent-fitness-functions/health-ca.crt https://127.0.0.1:7890/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /run/agent-fitness-functions:uid=1001,gid=1001,mode=0755,size=1m,nosuid,nodev,noexec
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: "1.0"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
