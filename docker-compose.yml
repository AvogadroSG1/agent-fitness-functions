# Docker Compose is the local/staging deployment contract for stack-fitness-functions.
# Compose applies restart, mounts, read_only, tmpfs, cap_drop, and security_opt locally.
# Resource enforcement differs by runtime: local Compose treats deploy.resources as
# advisory compatibility metadata, while Swarm has enforced deploy.resources limits.
# Kubernetes production deployments MUST use the Helm chart as authoritative.
# The production Helm chart is maintained externally and is NOT included in this repository.
# Helm chart is authoritative for pod securityContext, resources.limits,
# ConfigMaps, Secrets, and read-only mounts.
services:
  stack-fitness-functions:
    image: stack-fitness-functions:${GIT_SHA:-local}
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    ports:
      - "7890:7890"
    # TLS is configured via the STACK_FITNESS_FUNCTIONS_TLS_* env vars below, which the
    # server reads as a fallback for --tls-cert/--tls-key/--tls-ca. Only --addr needs
    # to be overridden here (the image default binds 0.0.0.0:7890 already).
    command:
      - --addr
      - 0.0.0.0:7890
    volumes:
      - ./configs:/app/configs:ro
      - ./certs:/app/certs:ro
      - ./caller-repos.json:/app/caller-repos.json:ro
    environment:
      STACK_FITNESS_FUNCTIONS_CONFIGS_DIR: /app/configs
      # Read by `server start` for TLS (fallback for --tls-cert/--tls-key/--tls-ca) and
      # by the healthcheck below to decide between https and http probing.
      STACK_FITNESS_FUNCTIONS_TLS_CERT: /app/certs/server.crt
      STACK_FITNESS_FUNCTIONS_TLS_KEY: /app/certs/server.key
      STACK_FITNESS_FUNCTIONS_TLS_CA: /app/certs/ca.crt
      STACK_FITNESS_FUNCTIONS_RATE_LIMIT: "100"
      STACK_FITNESS_FUNCTIONS_ANALYZER_TIMEOUT: "30s"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$STACK_FITNESS_FUNCTIONS_TLS_CA\" ]; then curl --fail --silent --cacert \"$$STACK_FITNESS_FUNCTIONS_TLS_CA\" https://127.0.0.1:7890/health; else curl --fail --silent http://127.0.0.1:7890/health; fi || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: "1.0"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
